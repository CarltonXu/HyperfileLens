services:
  postgres:
    image: postgres:15
    container_name: hyperfilelens-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-hyperfilelens}
      POSTGRES_USER: ${POSTGRES_USER:-hyperfilelens}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me-in-production}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-hyperfilelens} -d ${POSTGRES_DB:-hyperfilelens}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: hyperfilelens-redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    ports:
      - "${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  control-init:
    build:
      context: .
      dockerfile: backend/Dockerfile
      args:
        PIP_INDEX_URL: ${PIP_INDEX_URL:-https://pypi.tuna.tsinghua.edu.cn/simple}
        PIP_TRUSTED_HOST: ${PIP_TRUSTED_HOST:-pypi.tuna.tsinghua.edu.cn}
    container_name: hyperfilelens-control-init
    restart: "no"
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-hyperfilelens}:${POSTGRES_PASSWORD:-change-me-in-production}@postgres:5432/${POSTGRES_DB:-hyperfilelens}
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/0
      SECRET_KEY: ${SECRET_KEY:-your-secret-key-change-in-production}
      DEBUG: ${DEBUG:-false}
      DJANGO_SETTINGS_MODULE: core.settings
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:-localhost,127.0.0.1,control}
      CSRF_TRUSTED_ORIGINS: ${CSRF_TRUSTED_ORIGINS:-http://localhost:5001}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:5001}
      CORS_ALLOW_ALL_ORIGINS: ${CORS_ALLOW_ALL_ORIGINS:-false}
      DJANGO_TIME_ZONE: ${DJANGO_TIME_ZONE:-UTC}
      STATIC_ROOT: ${STATIC_ROOT:-/app/staticfiles}
      MEDIA_ROOT: ${MEDIA_ROOT:-/app/media}
      PUBLIC_CONTROL_PLANE_URL: ${PUBLIC_CONTROL_PLANE_URL:-}
      LOG_FILE: ${LOG_FILE:-/app/logs/app.log}
      SESSION_COOKIE_AGE: ${SESSION_COOKIE_AGE:-86400}
      SESSION_COOKIE_SECURE: ${SESSION_COOKIE_SECURE:-false}
      SESSION_COOKIE_HTTPONLY: ${SESSION_COOKIE_HTTPONLY:-true}
      CSRF_COOKIE_SECURE: ${CSRF_COOKIE_SECURE:-false}
      CSRF_COOKIE_HTTPONLY: ${CSRF_COOKIE_HTTPONLY:-false}
      SECURE_SSL_REDIRECT: ${SECURE_SSL_REDIRECT:-false}
      HFL_ADMIN_EMAIL: ${HFL_ADMIN_EMAIL:-admin@hyperfilelens.local}
      HFL_ADMIN_PASSWORD: ${HFL_ADMIN_PASSWORD:-}
      HFL_ADMIN_FIRST_NAME: ${HFL_ADMIN_FIRST_NAME:-System}
      HFL_ADMIN_LAST_NAME: ${HFL_ADMIN_LAST_NAME:-Administrator}
      KOPIA_VERSION: ${KOPIA_VERSION:-0.22.3}
      KOPIA_DOWNLOAD_BASE_URL: ${KOPIA_DOWNLOAD_BASE_URL:-https://github.com/kopia/kopia/releases/download/v${KOPIA_VERSION:-0.22.3}}
      KOPIA_DOWNLOAD_TIMEOUT: ${KOPIA_DOWNLOAD_TIMEOUT:-120}
    volumes:
      - backend_static:/app/staticfiles
      - backend_media:/app/media
      - backend_logs:/app/logs
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: >
      sh -c "python manage.py migrate &&
             python manage.py ensure_initial_superuser &&
             python manage.py collectstatic --noinput &&
             KOPIA_OUTPUT_DIR=/app/staticfiles/downloads/packages/kopia /app/scripts/download-kopia-packages.sh &&
             python manage.py ensure_install_packages &&
             python manage.py register_periodic_tasks &&
             python manage.py verify_licenses"

  control:
    build:
      context: .
      dockerfile: backend/Dockerfile
      args:
        PIP_INDEX_URL: ${PIP_INDEX_URL:-https://pypi.tuna.tsinghua.edu.cn/simple}
        PIP_TRUSTED_HOST: ${PIP_TRUSTED_HOST:-pypi.tuna.tsinghua.edu.cn}
    container_name: hyperfilelens-control
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-hyperfilelens}:${POSTGRES_PASSWORD:-change-me-in-production}@postgres:5432/${POSTGRES_DB:-hyperfilelens}
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/0
      SECRET_KEY: ${SECRET_KEY:-your-secret-key-change-in-production}
      DEBUG: ${DEBUG:-false}
      DJANGO_SETTINGS_MODULE: core.settings
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:-localhost,127.0.0.1,control}
      CSRF_TRUSTED_ORIGINS: ${CSRF_TRUSTED_ORIGINS:-http://localhost:5001}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:5001}
      CORS_ALLOW_ALL_ORIGINS: ${CORS_ALLOW_ALL_ORIGINS:-false}
      DJANGO_TIME_ZONE: ${DJANGO_TIME_ZONE:-UTC}
      STATIC_ROOT: ${STATIC_ROOT:-/app/staticfiles}
      MEDIA_ROOT: ${MEDIA_ROOT:-/app/media}
      PUBLIC_CONTROL_PLANE_URL: ${PUBLIC_CONTROL_PLANE_URL:-}
      LOG_FILE: ${LOG_FILE:-/app/logs/app.log}
      SESSION_COOKIE_AGE: ${SESSION_COOKIE_AGE:-86400}
      SESSION_COOKIE_SECURE: ${SESSION_COOKIE_SECURE:-false}
      SESSION_COOKIE_HTTPONLY: ${SESSION_COOKIE_HTTPONLY:-true}
      CSRF_COOKIE_SECURE: ${CSRF_COOKIE_SECURE:-false}
      CSRF_COOKIE_HTTPONLY: ${CSRF_COOKIE_HTTPONLY:-false}
      SECURE_SSL_REDIRECT: ${SECURE_SSL_REDIRECT:-false}
    volumes:
      - backend_static:/app/staticfiles
      - backend_media:/app/media
      - backend_logs:/app/logs
    depends_on:
      control-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/health/', timeout=5).read()\""]
      interval: 20s
      timeout: 10s
      retries: 6
      start_period: 20s
    command: daphne -b 0.0.0.0 -p 8000 core.asgi:application

  celery-worker:
    build:
      context: .
      dockerfile: backend/Dockerfile
      args:
        PIP_INDEX_URL: ${PIP_INDEX_URL:-https://pypi.tuna.tsinghua.edu.cn/simple}
        PIP_TRUSTED_HOST: ${PIP_TRUSTED_HOST:-pypi.tuna.tsinghua.edu.cn}
    container_name: hyperfilelens-celery-worker
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-hyperfilelens}:${POSTGRES_PASSWORD:-change-me-in-production}@postgres:5432/${POSTGRES_DB:-hyperfilelens}
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/0
      SECRET_KEY: ${SECRET_KEY:-your-secret-key-change-in-production}
      DEBUG: ${DEBUG:-false}
      DJANGO_SETTINGS_MODULE: core.settings
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:-localhost,127.0.0.1,control}
      MEDIA_ROOT: ${MEDIA_ROOT:-/app/media}
      LOG_FILE: ${LOG_FILE:-/app/logs/app.log}
    volumes:
      - backend_media:/app/media
      - backend_logs:/app/logs
    depends_on:
      control-init:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    command: celery -A core worker -l info

  celery-beat:
    build:
      context: .
      dockerfile: backend/Dockerfile
      args:
        PIP_INDEX_URL: ${PIP_INDEX_URL:-https://pypi.tuna.tsinghua.edu.cn/simple}
        PIP_TRUSTED_HOST: ${PIP_TRUSTED_HOST:-pypi.tuna.tsinghua.edu.cn}
    container_name: hyperfilelens-celery-beat
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-hyperfilelens}:${POSTGRES_PASSWORD:-change-me-in-production}@postgres:5432/${POSTGRES_DB:-hyperfilelens}
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/0
      SECRET_KEY: ${SECRET_KEY:-your-secret-key-change-in-production}
      DEBUG: ${DEBUG:-false}
      DJANGO_SETTINGS_MODULE: core.settings
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:-localhost,127.0.0.1,control}
      LOG_FILE: ${LOG_FILE:-/app/logs/app.log}
    volumes:
      - backend_logs:/app/logs
    depends_on:
      control-init:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    command: celery -A core beat -l info --scheduler django_celery_beat.schedulers:DatabaseScheduler

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NPM_REGISTRY: ${NPM_REGISTRY:-https://registry.npmmirror.com}
    container_name: hyperfilelens-frontend
    restart: unless-stopped
    environment:
      PORT: 5000
      API_PROXY_HOST: control
      API_PROXY_PORT: 8000
    depends_on:
      control:
        condition: service_healthy

  nginx:
    image: nginx:1.25-alpine
    container_name: hyperfilelens-nginx
    restart: unless-stopped
    ports:
      - "${PUBLIC_HTTP_PORT:-5001}:80"
    volumes:
      - ./docker/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - backend_static:/app/staticfiles:ro
      - backend_media:/app/media:ro
    depends_on:
      control:
        condition: service_healthy
      frontend:
        condition: service_started

  gateway-agent:
    profiles: ["gateway"]
    build:
      context: ./gateway/agent
      dockerfile: Dockerfile
      args:
        PIP_INDEX_URL: ${PIP_INDEX_URL:-https://pypi.tuna.tsinghua.edu.cn/simple}
        PIP_TRUSTED_HOST: ${PIP_TRUSTED_HOST:-pypi.tuna.tsinghua.edu.cn}
    container_name: hyperfilelens-gateway-agent
    restart: unless-stopped
    environment:
      SERVER_URL: ${PUBLIC_CONTROL_PLANE_URL:?PUBLIC_CONTROL_PLANE_URL is required}
      WS_PROTOCOL: ${GATEWAY_WS_PROTOCOL:-ws}
      GATEWAY_ID: ${GATEWAY_ID:-}
      INSTALL_TOKEN: ${GATEWAY_INSTALL_TOKEN:-}
      API_TOKEN: ${GATEWAY_API_TOKEN:-}
      GATEWAY_NAME: ${GATEWAY_NAME:-gateway-01}
      KOPIA_PATH: /usr/bin/kopia
      MOUNT_BASE_PATH: /mnt/kopia
      REPO_PATH: /var/lib/hyperfilelens/repository
      LOG_LEVEL: ${GATEWAY_LOG_LEVEL:-INFO}
    volumes:
      - gateway_data:/var/lib/hyperfilelens
      - gateway_mount:/mnt/kopia
      - gateway_logs:/var/log/hyperfilelens
    depends_on:
      control:
        condition: service_started
    privileged: true

  proxy-agent:
    profiles: ["proxy"]
    build:
      context: ./proxy
      dockerfile: Dockerfile
      args:
        GOPROXY: ${GOPROXY:-https://goproxy.cn,direct}
    container_name: hyperfilelens-proxy-agent
    restart: unless-stopped
    environment:
      SERVER_URL: ${PUBLIC_CONTROL_PLANE_URL:?PUBLIC_CONTROL_PLANE_URL is required}
      API_TOKEN: ${PROXY_API_TOKEN:-}
      PROXY_ROLE: ${PROXY_ROLE:-agent}
    volumes:
      - proxy_data:/var/lib/hyperfilelens
      - proxy_logs:/var/log/hyperfilelens
      - ${PROXY_SOURCE_PATH:-/data}:/data:ro
    depends_on:
      control:
        condition: service_started
    privileged: true

volumes:
  postgres_data:
  redis_data:
  backend_static:
  backend_media:
  backend_logs:
  gateway_data:
  gateway_mount:
  gateway_logs:
  proxy_data:
  proxy_logs:

networks:
  default:
    name: hyperfilelens-network
