version: "3.9"

services:
  # PostgreSQL Database
  postgres:
    image: postgres:15
    container_name: hyperfilelens-postgres
    environment:
      POSTGRES_DB: hyperfilelens
      POSTGRES_USER: hfl
      POSTGRES_PASSWORD: hfl_password
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hfl -d hyperfilelens"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis for Celery and Caching
  redis:
    image: redis:7-alpine
    container_name: hyperfilelens-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Django Control Plane
  control:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: hyperfilelens-control
    environment:
      - DATABASE_URL=postgresql://hfl:hfl_password@postgres:5432/hyperfilelens
      - REDIS_URL=redis://redis:6379/0
      - SECRET_KEY=${SECRET_KEY:-your-secret-key-change-in-production}
      - DEBUG=${DEBUG:-True}
      - ALLOWED_HOSTS=localhost,127.0.0.1,control
      - CORS_ALLOWED_ORIGINS=http://localhost:3000,http://localhost:5000
    volumes:
      - ./backend:/app
      - backend_static:/app/staticfiles
      - backend_media:/app/media
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: >
      sh -c "python manage.py migrate &&
             python manage.py collectstatic --noinput &&
             gunicorn core.wsgi:application --bind 0.0.0.0:8000 --workers 4"

  # Celery Worker for Background Tasks
  celery-worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: hyperfilelens-celery-worker
    environment:
      - DATABASE_URL=postgresql://hfl:hfl_password@postgres:5432/hyperfilelens
      - REDIS_URL=redis://redis:6379/0
      - SECRET_KEY=${SECRET_KEY:-your-secret-key-change-in-production}
    volumes:
      - ./backend:/app
    depends_on:
      - control
      - redis
    command: celery -A core worker -l info

  # Celery Beat for Scheduled Tasks
  celery-beat:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: hyperfilelens-celery-beat
    environment:
      - DATABASE_URL=postgresql://hfl:hfl_password@postgres:5432/hyperfilelens
      - REDIS_URL=redis://redis:6379/0
      - SECRET_KEY=${SECRET_KEY:-your-secret-key-change-in-production}
    volumes:
      - ./backend:/app
    depends_on:
      - control
      - redis
    command: celery -A core beat -l info

  # Gateway Service (FastAPI + Kopia)
  gateway:
    build:
      context: ./gateway
      dockerfile: Dockerfile
    container_name: hyperfilelens-gateway
    environment:
      - KOPIA_MOUNT_PATH=/mnt/kopia
      - REPO_PATH=/data/repo
      - CONTROL_URL=http://control:8000
      - GATEWAY_ID=gateway-1
    volumes:
      - kopia_repo:/data/repo
      - kopia_mount:/mnt/kopia
    ports:
      - "8001:8001"
    depends_on:
      - control
    privileged: true  # Required for FUSE mount

  # Vue Frontend
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: hyperfilelens-frontend
    environment:
      - VITE_API_URL=http://localhost:8000
      - VITE_GATEWAY_URL=http://localhost:8001
    ports:
      - "5000:5000"
    depends_on:
      - control
      - gateway

volumes:
  postgres_data:
  redis_data:
  backend_static:
  backend_media:
  kopia_repo:
  kopia_mount:

networks:
  default:
    name: hyperfilelens-network
