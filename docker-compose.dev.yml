version: '3.8'

# =====================================================
# HyperFileLens Docker Compose - Development
# =====================================================

services:
  # =====================================================
  # PostgreSQL Database
  # =====================================================
  db:
    image: postgres:15-alpine
    container_name: hyperfilelens-db-dev
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-hyperfilelens_dev}
      POSTGRES_USER: ${POSTGRES_USER:-hyperfilelens_dev}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-hyperfilelens_dev}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_dev_data:/var/lib/postgresql/data
    networks:
      - hyperfilelens-dev-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-hyperfilelens_dev} -d ${POSTGRES_DB:-hyperfilelens_dev}"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 512M

  # =====================================================
  # Redis Cache
  # =====================================================
  redis:
    image: redis:7-alpine
    container_name: hyperfilelens-redis-dev
    restart: unless-stopped
    command: redis-server --appendonly yes
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_dev_data:/data
    networks:
      - hyperfilelens-dev-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M

  # =====================================================
  # Backend Development Server
  # =====================================================
  backend:
    image: hyperfilelens-backend-dev
    build:
      context: ./backend
      dockerfile: ../Dockerfile.dev
    container_name: hyperfilelens-backend-dev
    restart: unless-stopped
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER:-hyperfilelens_dev}:${POSTGRES_PASSWORD:-hyperfilelens_dev}@db:5432/${POSTGRES_DB:-hyperfilelens_dev}
      - REDIS_URL=${REDIS_URL:-redis://redis:6379/0}
      - CELERY_BROKER_URL=${CELERY_BROKER_URL:-redis://redis:6379/0}
      - SECRET_KEY=${SECRET_KEY:-dev-secret-key-for-development-only}
      - DEBUG=${DEBUG:-true}
      - DJANGO_SETTINGS_MODULE=core.settings
      - DEV_MODE=true
      - ALLOWED_HOSTS=${ALLOWED_HOSTS:-localhost,127.0.0.1,backend}
      - CSRF_TRUSTED_ORIGINS=${CSRF_TRUSTED_ORIGINS:-http://localhost:5173,http://localhost:8000}
      - CORS_ALLOWED_ORIGINS=${CORS_ALLOWED_ORIGINS:-http://localhost:5173,http://localhost:8000}
      - CORS_ALLOW_ALL_ORIGINS=${CORS_ALLOW_ALL_ORIGINS:-true}
      - PUBLIC_CONTROL_PLANE_URL=${PUBLIC_CONTROL_PLANE_URL:-http://localhost:8000}
      - STATIC_ROOT=${STATIC_ROOT:-/app/staticfiles}
      - MEDIA_ROOT=${MEDIA_ROOT:-/app/media}
      - LOG_FILE=${LOG_FILE:-/app/logs/app.log}
    volumes:
      - ./backend:/app:rw
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - hyperfilelens-dev-network
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 2G
    command: >
      sh -c "python manage.py migrate &&
             python manage.py runserver 0.0.0.0:8000"

  # =====================================================
  # Frontend Development Server (Vite)
  # =====================================================
  frontend:
    build:
      context: ./frontend
      dockerfile: ../Dockerfile.frontend.dev
    container_name: hyperfilelens-frontend-dev
    restart: unless-stopped
    environment:
      - VITE_API_BASE_URL=http://backend:8000
      - VITE_WS_BASE_URL=ws://backend:8000
      - VITE_APP_TITLE=HyperFileLens
    volumes:
      - ./frontend/src:/app/src:rw
      - ./frontend/public:/app/public:rw
      - ./frontend/index.html:/app/index.html:rw
      - ./frontend/vite.config.ts:/app/vite.config.ts:rw
      - ./frontend/tailwind.config.js:/app/tailwind.config.js:rw
      - ./frontend/postcss.config.js:/app/postcss.config.js:rw
      - ./frontend/tsconfig.json:/app/tsconfig.json:rw
      - ./frontend/tsconfig.node.json:/app/tsconfig.node.json:rw
    ports:
      - "${FRONTEND_PORT:-5173}:5173"
    networks:
      - hyperfilelens-dev-network
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 1G
    command: npm run dev -- --host 0.0.0.0 --port 5173

  # =====================================================
  # Celery Worker (Development)
  # =====================================================
  celery:
    image: hyperfilelens-backend-dev
    container_name: hyperfilelens-celery-dev
    restart: unless-stopped
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER:-hyperfilelens_dev}:${POSTGRES_PASSWORD:-hyperfilelens_dev}@db:5432/${POSTGRES_DB:-hyperfilelens_dev}
      - REDIS_URL=${REDIS_URL:-redis://redis:6379/0}
      - CELERY_BROKER_URL=${CELERY_BROKER_URL:-redis://redis:6379/0}
      - SECRET_KEY=${SECRET_KEY:-dev-secret-key-for-development-only}
      - DEBUG=${DEBUG:-true}
      - DJANGO_SETTINGS_MODULE=core.settings
      - DEV_MODE=true
      - LOG_FILE=${LOG_FILE:-/app/logs/app.log}
    volumes:
      - ./backend:/app:ro
    depends_on:
      backend:
        condition: service_started
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - hyperfilelens-dev-network
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 1G
    command: celery -A core worker --loglevel=debug

  # =====================================================
  # Celery Beat (Development)
  # =====================================================
  celery-beat:
    image: hyperfilelens-backend-dev
    container_name: hyperfilelens-celery-beat-dev
    restart: unless-stopped
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER:-hyperfilelens_dev}:${POSTGRES_PASSWORD:-hyperfilelens_dev}@db:5432/${POSTGRES_DB:-hyperfilelens_dev}
      - REDIS_URL=${REDIS_URL:-redis://redis:6379/0}
      - CELERY_BROKER_URL=${CELERY_BROKER_URL:-redis://redis:6379/0}
      - SECRET_KEY=${SECRET_KEY:-dev-secret-key-for-development-only}
      - DEBUG=${DEBUG:-true}
      - DJANGO_SETTINGS_MODULE=core.settings
      - DEV_MODE=true
      - LOG_FILE=${LOG_FILE:-/app/logs/app.log}
    volumes:
      - ./backend:/app:ro
    depends_on:
      backend:
        condition: service_started
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - hyperfilelens-dev-network
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
    command: celery -A core beat --loglevel=debug --scheduler django_celery_beat.schedulers:DatabaseScheduler

# =====================================================
# Networks
# =====================================================
networks:
  hyperfilelens-dev-network:
    driver: bridge

# =====================================================
# Volumes
# =====================================================
volumes:
  postgres_dev_data:
    driver: local
  redis_dev_data:
    driver: local
