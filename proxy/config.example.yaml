# HyperFileLens Proxy Configuration
# =================================

version: "1.0.0"

# Proxy Role: "agent" or "sync"
# - agent: Source-side agent (runs on business servers, reads local filesystem)
# - sync:  Sync proxy (collector node, mounts NAS, provides unified data access)
role: "agent"

# Server connection
server:
  url: "http://localhost:8000"
  api_token: ""  # Set via API_TOKEN env var or here
  ws_protocol: "ws"  # "ws" or "wss"
  reconnect_delay: 5s
  heartbeat_interval: 10s
  verify_ssl: true  # Verify SSL certificate
  timeout: 30s      # Request timeout

# Agent settings
agent:
  id: ""  # Proxy ID from the control plane install command
  name: ""  # Auto-detected hostname if empty
  hostname: ""  # Auto-detected if empty
  install_token: ""  # Cleared after the proxy registers and saves api_token

# Kopia settings
kopia:
  path: "kopia"  # Path to Kopia binary
  cache_path: "/var/lib/hyperfilelens/cache"
  config_path: ""  # Optional: path to kopia config

# Mount settings (Sync Proxy only)
mount:
  enabled: false  # Set to true for Sync Proxy
  nfs:
    server: ""
    path: ""
    target: "/mnt/nas"
  smb:
    server: ""
    share: ""
    target: "/mnt/smb"
    username: ""
    password: ""

# Performance settings
performance:
  max_concurrent_tasks: 5      # Maximum concurrent tasks
  task_timeout_seconds: 3600   # Task execution timeout
  compression_enabled: true   # Enable compression
  compression_level: 6        # Compression level (0-9)
  rate_limit_kbps: 0         # Network rate limit (0 = no limit)
  buffer_size_mb: 100        # Buffer size for data transfer
  chunk_size_mb: 50          # Chunk size for data transfer

# Security settings
security:
  tls_verify: true              # Verify TLS certificate
  tls_cert_path: ""            # Path to TLS certificate
  tls_key_path: ""             # Path to TLS private key
  allowed_hosts:               # Allowed server hosts
    - "localhost"
    - "127.0.0.1"
  enable_metrics_auth: true    # Require authentication for metrics
  metrics_password: ""        # Password for metrics endpoint

# Storage settings
storage:
  cache_size_mb: 1024          # Cache size in MB
  temp_directory: "/var/lib/hyperfilelens/tmp"  # Stable temporary directory
  temp_cleanup: true            # Cleanup temporary files

# Logging
logging:
  level: "info"  # "debug", "info", "warn", "error"
  file: "/var/log/hyperfilelens/proxy.log"
  max_size: "100MB"
  max_backups: 5
  format: "text"  # "text" or "json"
  remote: false    # Send logs to remote server
